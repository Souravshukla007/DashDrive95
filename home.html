    &lt;script&gt;
    document.addEventListener('DOMContentLoaded', () =&gt; {
      // Enhanced Mobile Menu Logic
      const menuToggle = document.getElementById('menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      const backdrop = document.getElementById('menu-backdrop');
      
      const toggleMenu = (show) =&gt; {
        const isActive = show !== undefined ? show : !mobileMenu.classList.contains('active');
        mobileMenu.classList.toggle('active', isActive);
        backdrop.classList.toggle('active', isActive);
        
        // Toggle Icon with animation transition
        menuToggle.innerHTML = isActive 
          ? '&lt;svg class=&quot;w-8 h-8&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; viewBox=&quot;0 0 24 24&quot;&gt;&lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;2&quot; d=&quot;M6 18L18 6M6 6l12 12&quot;&gt;&lt;/path&gt;&lt;/svg&gt;'
          : '&lt;svg class=&quot;w-8 h-8&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; viewBox=&quot;0 0 24 24&quot;&gt;&lt;path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;2&quot; d=&quot;M4 6h16M4 12h16m-7 6h7&quot;&gt;&lt;/path&gt;&lt;/svg&gt;';
        
        // Prevent scroll when menu is open
        document.body.style.overflow = isActive ? 'hidden' : '';
      };

      if (menuToggle &amp;&amp; mobileMenu) {
        menuToggle.addEventListener('click', (e) =&gt; {
          e.stopPropagation();
          toggleMenu();
        });

        backdrop.addEventListener('click', () =&gt; toggleMenu(false));
        
        // Close menu when clicking on a link
        mobileMenu.querySelectorAll('a').forEach(link =&gt; {
          link.addEventListener('click', () =&gt; toggleMenu(false));
        });
      }

      // Letter Splitting Logic
      document.querySelectorAll('[data-animation-letters]').forEach(el =&gt; {
        const text = el.innerText;
        el.innerText = '';
        el.setAttribute('aria-label', text);
        
        text.split('').forEach((char, i) =&gt; {
          const span = document.createElement('span');
          span.innerText = char === ' ' ? '\u00A0' : char;
          span.classList.add('letter');
          span.style.transitionDelay = `${(i * 0.03)}s`;
          el.appendChild(span);
        });
      });

      const observer = new IntersectionObserver((entries) =&gt; {
        entries.forEach(entry =&gt; {
          if (entry.isIntersecting) {
            entry.target.classList.add('animate-on-scroll-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('[data-animation-on-scroll]').forEach(el =&gt; {
        const type = el.dataset.animationType || 'up';
        const delay = el.dataset.animationDelay || '0s';
        el.style.transitionDelay = delay;

        if (type === 'left') el.classList.add('animate-on-scroll-left');
        else if (type === 'right') el.classList.add('animate-on-scroll-right');
        else if (type === 'scale') el.classList.add('animate-on-scroll-scale');
        else el.classList.add('animate-on-scroll-hidden');

        observer.observe(el);
      });

      // Looping Animations
      document.querySelectorAll('[data-animation-loop]').forEach(el =&gt; {
        if (el.dataset.animationLoop === 'float') {
          el.classList.add('animation-float');
        }
      });
    });
  &lt;/script&gt;
